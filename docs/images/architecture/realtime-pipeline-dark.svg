<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">XmaxSDK realtime generation pipeline</title>
  <desc id="desc">A local camera or video stream is sent to Xmax X2.0 over a WebRTC uplink, and generated video is returned over a WebRTC downlink.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1l10 5-10 5" fill="none" stroke="#8994A3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1552" height="552" rx="28" fill="#0D1117" stroke="#2D3642" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="72" y="72" width="448" height="456" rx="24" fill="#111820" stroke="#303A46" stroke-width="2"/>
    <text x="108" y="123" fill="#8D99A8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" letter-spacing="2.4">YOUR APPLICATION</text>

    <rect x="108" y="152" width="376" height="144" rx="18" fill="#171F29" stroke="#303A46" stroke-width="1.5"/>
    <rect x="136" y="188" width="72" height="72" rx="16" fill="#111820" stroke="#35404D" stroke-width="1.5"/>
    <rect x="157" y="210" width="31" height="27" rx="5" fill="none" stroke="#AAB4C0" stroke-width="2.8"/>
    <path d="M188 216l12-8v31l-12-8z" fill="none" stroke="#AAB4C0" stroke-width="2.8" stroke-linejoin="round"/>
    <text x="232" y="218" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="650">Camera or video</text>
    <text x="232" y="251" fill="#8D99A8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Local input stream</text>

    <rect x="108" y="320" width="376" height="144" rx="18" fill="#171F29" stroke="#303A46" stroke-width="1.5"/>
    <rect x="136" y="356" width="72" height="72" rx="16" fill="#111820" stroke="#35404D" stroke-width="1.5"/>
    <rect x="155" y="374" width="35" height="27" rx="4" fill="none" stroke="#AAB4C0" stroke-width="2.8"/>
    <path d="M172.5 401v9m-11 0h22" fill="none" stroke="#AAB4C0" stroke-width="2.8" stroke-linecap="round"/>
    <text x="232" y="386" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="650">Generated video</text>
    <text x="232" y="419" fill="#8D99A8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Remote output stream</text>
  </g>

  <g>
    <path d="M560 224h590" fill="none" stroke="#8994A3" stroke-width="2.4" marker-end="url(#arrow)"/>
    <rect x="751" y="194" width="224" height="60" rx="30" fill="#111820" stroke="#303A46" stroke-width="1.5"/>
    <circle cx="785" cy="224" r="6" fill="#D1843E"/>
    <text x="808" y="231" fill="#D5DCE5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="650">WebRTC uplink</text>

    <path d="M1150 392H560" fill="none" stroke="#8994A3" stroke-width="2.4" marker-end="url(#arrow)"/>
    <rect x="739" y="362" width="248" height="60" rx="30" fill="#111820" stroke="#303A46" stroke-width="1.5"/>
    <circle cx="773" cy="392" r="6" fill="#CB725E"/>
    <text x="796" y="399" fill="#D5DCE5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="650">WebRTC downlink</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="112" width="338" height="376" rx="26" fill="#111820" stroke="#303A46" stroke-width="2"/>
    <rect x="1279" y="160" width="160" height="160" rx="40" fill="#171F29" stroke="#303A46" stroke-width="1.5"/>
    <path d="M1359 191l13 44 43 13-43 13-13 44-13-44-43-13 43-13z" fill="#E6EDF3"/>
    <circle cx="1404" cy="205" r="8" fill="#D1843E"/>
    <text x="1359" y="377" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="700">Xmax X2.0</text>
    <text x="1359" y="412" text-anchor="middle" fill="#8D99A8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Realtime generation</text>
  </g>
</svg>
